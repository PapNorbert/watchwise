apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pn-ingress
  labels:
    owner: pn
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: pn-service-server
                port:
                  number: 3000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: pn-service-server
                port:
                  number: 3000
          - path: /websocket
            pathType: Prefix
            backend:
              service:
                name: pn-service-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pn-service-client
                port:
                  number: 3001
