          \ verify_override=False)\n            db = client.db(db_name, username=username,\
          \ password=password)\n            collection = db.collection(collection_name)\n\
          \            result = collection.insert_many(data, overwrite=True, overwrite_mode='update')\n\
          \            return result\n        except Exception as e:\n           \
          \ print(e)\n            return []\n\n    def string_to_5_digit_number(s:\
          \ str) -> str:\n        try:\n            hash_object = hashlib.md5(s.encode())\n\
          \            hash_hex = hash_object.hexdigest()\n            unique_number\
          \ = int(hash_hex[:8], 16) % 100000\n            return str(unique_number)\n\
          \        except Exception as e:\n            print(e)\n\n\n    try:\n  \
