# PIPELINE DEFINITION
# Name: model-train-pipeline
# Description: A pipeline for training the model with new data
components:
  comp-get-train-data:
    executorLabel: exec-get-train-data
    inputDefinitions:
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        output_dir:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_data_folder:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        db_name:
          parameterType: STRING
        fields_to_use:
          parameterType: LIST
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
        model_name:
          parameterType: STRING
        password:
          parameterType: STRING
        url:
          parameterType: STRING
        username:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        new_movie_embeddings_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        new_serie_embeddings_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-upload-and-cleanup:
    executorLabel: exec-upload-and-cleanup
    inputDefinitions:
      artifacts:
        new_movie_embeddings:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        new_serie_embeddings:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        train_data_file:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        minio_access_key:
          parameterType: STRING
        minio_endpoint:
          parameterType: STRING
        minio_secret_key:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-get-train-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - get_train_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.11.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'boto3==1.36.16'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef get_train_data(minio_endpoint: str, minio_access_key: str, minio_secret_key:\
          \ str,\n                       output_dir: dsl.OutputPath()):\n    import\
          \ os\n    import boto3\n\n    DATA_BUCKET = \"data\"\n\n    s3_client =\
          \ boto3.client(\n        \"s3\",\n        endpoint_url=minio_endpoint,\n\
          \        aws_access_key_id=minio_access_key,\n        aws_secret_access_key=minio_secret_key\n\
          \    )\n\n    os.makedirs(output_dir, exist_ok=True)\n\n    prefixes = [\"\
          train/new/\"]\n    for prefix in prefixes:\n        objects = s3_client.list_objects_v2(Bucket=DATA_BUCKET,\
          \ Prefix=prefix)\n        if \"Contents\" in objects:\n            for obj\
          \ in objects.get(\"Contents\", []):\n                file_key = obj[\"Key\"\
          ]\n                file_name = os.path.basename(file_key)\n            \
          \    local_file_path = os.path.join(output_dir, file_name)\n           \
          \     s3_client.download_file(DATA_BUCKET, file_key, local_file_path)\n\
          \                print(f\"Downloaded: {file_key} \u2192 {local_file_path}\"\
          )\n\n    print(f\"Download complete for all files in {output_dir}\")\n\n"
        image: python:3.9
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.11.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'transformers==4.45.2'\
          \ 'sentence-transformers==3.1.1' 'boto3==1.36.16' 'datasets==3.1.0' 'torch==2.5.0'\
          \ 'accelerate==1.1.1' 'python-arango==8.1.0' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n        minio_endpoint: str, minio_access_key:\
          \ str, minio_secret_key: str,\n        url: str, db_name: str, username:\
          \ str, password: str,\n        model_name: str, fields_to_use: list,\n \
          \       train_data_folder: dsl.InputPath(),\n        new_movie_embeddings_output:\
          \ dsl.OutputPath(), \n        new_serie_embeddings_output: dsl.OutputPath()\n\
          \    ):\n    import os\n    import json\n    import boto3\n    import zipfile\n\
          \    import ast\n    import csv\n    import uuid\n    from datasets import\
          \ Dataset\n    from sentence_transformers import SentenceTransformer, losses,\
          \ SentenceTransformerTrainingArguments, \\\n        SentenceTransformerTrainer\n\
          \    from sklearn.model_selection import train_test_split\n    from arango\
          \ import ArangoClient\n\n\n    MODEL_BUCKET = \"models\"\n    TEMP_DIR =\
          \ \"/tmp/models\"\n    MODEL_ZIP_PATH = os.path.join(TEMP_DIR, f\"{model_name}.zip\"\
          )\n\n    s3_client = boto3.client(\n        \"s3\",\n        endpoint_url=minio_endpoint,\n\
          \        aws_access_key_id=minio_access_key,\n        aws_secret_access_key=minio_secret_key\n\
          \    )\n\n    def fine_tune_model(model, full_train_data, trained_model_path,\
          \ epochs=1):\n        \"\"\"\n        Fine-tune the SentenceTransformer\
          \ model using the provided training data.\n\n        Args:\n           \
          \ model: The model to be fine tuned.\n            full_train_data (list):\
          \ List of training examples with 'text1', 'text2', and 'label'.\n      \
          \      trained_model_path (string): The location to save the final model.\n\
          \            epochs (int): Number of epochs for fine-tuning.\n\n       \
          \ Returns:\n            model (SentenceTransformer): Fine-tuned SentenceTransformer\
          \ model.\n        \"\"\"\n        train_data, eval_data = train_test_split(full_train_data,\
          \ test_size=0.1, random_state=42)\n\n        train_dataset = Dataset.from_dict({\n\
          \            'sentence1': [item['text1'] for item in train_data],\n    \
          \        'sentence2': [item['text2'] for item in train_data],\n        \
          \    'score': [item['label'] for item in train_data],\n        })\n    \
          \    eval_dataset = Dataset.from_dict({\n            'sentence1': [(item['text1'])\
          \ for item in eval_data],\n            'sentence2': [item['text2'] for item\
          \ in eval_data],\n            'score': [item['label'] for item in eval_data],\n\
          \        })\n        train_loss = losses.CosineSimilarityLoss(model=model)\n\
          \n        args = SentenceTransformerTrainingArguments(\n            # Required\
          \ parameter:\n            output_dir=\"/tmp/model/trained\",\n         \
          \   # Optional training parameters:\n            num_train_epochs=epochs,\n\
          \            warmup_ratio=0.1,\n            # Optional tracking/debugging\
          \ parameters:\n            eval_strategy=\"steps\",\n            eval_steps=300,\n\
          \            save_strategy=\"steps\",\n            save_steps=300,\n   \
          \         save_total_limit=2,\n            load_best_model_at_end=True,\n\
          \            logging_steps=100\n        )\n        trainer = SentenceTransformerTrainer(\n\
          \            model=model,\n            args=args,\n            train_dataset=train_dataset,\n\
          \            eval_dataset=eval_dataset,\n            loss=train_loss,\n\
          \        )\n        trainer.train()\n        model.save_pretrained(trained_model_path)\n\
          \        return model\n\n    def zip_folder(folder_path, output_zip, model_name):\n\
          \        print('Creating ZIP')\n        with zipfile.ZipFile(output_zip,\
          \ 'w', zipfile.ZIP_DEFLATED) as zipf:\n            for root, dirs, files\
          \ in os.walk(folder_path):\n                for dir in dirs:\n         \
          \           zip_folder_path = os.path.join(root, dir)\n                \
          \    rel_path = os.path.relpath(zip_folder_path, folder_path)\n        \
          \            zipf.write(zip_folder_path, os.path.join(model_name, rel_path)\
          \ + '/')\n                for file in files:\n                    abs_path\
          \ = os.path.join(root, file)\n                    rel_path = os.path.relpath(abs_path,\
          \ folder_path)\n                    zipf.write(abs_path, os.path.join(model_name,\
          \ rel_path))\n        print(f\"ZIP created at {output_zip}.zip\")\n\n  \
          \  def update_embeddings(model, fields_to_use):\n\n        def clear_collection(collection_name):\n\
          \            try:\n                client = ArangoClient(hosts=url, request_timeout=240,\
          \ verify_override=False)\n                db = client.db(db_name, username=username,\
          \ password=password)\n                collection = db.collection(collection_name)\n\
          \                collection.truncate()\n                print(f\"Collection\
          \ '{collection_name}' has been cleared.\")\n                return True\n\
          \            except Exception as e:\n                print(f\"Error clearing\
          \ collection '{collection_name}': {e}\")\n                return False\n\
          \n        def read_movie_embeddings(file_path):\n            with open(file_path,\
          \ mode='r', encoding='utf-8') as file:\n                csv_reader = csv.reader(file)\n\
          \                header = next(csv_reader)\n                movies_w_embeddings\
          \ = []\n                for row in csv_reader:\n                    row_embedding\
          \ = ast.literal_eval(row[14]) if row[14] else []\n                    movies_w_embeddings.append({\n\
          \                        'movieId': row[0],\n                        'name':\
          \ row[4],\n                        'poster': row[12],\n                \
          \        'embedding': row_embedding,\n                    })\n         \
          \       return movies_w_embeddings\n\n        def read_serie_embeddings(file_path):\n\
          \            with open(file_path, mode='r', encoding='utf-8') as file:\n\
          \                csv_reader = csv.reader(file)\n                _header\
          \ = next(csv_reader)\n                movies_w_embeddings = []\n       \
          \         for row in csv_reader:\n                    row_embedding = ast.literal_eval(row[18])\
          \ if row[18] else []\n                    movies_w_embeddings.append({\n\
          \                        'series_id': row[0],\n                        'name':\
          \ row[3],\n                        'poster': row[14],\n                \
          \        'embedding': row_embedding,\n                    })\n         \
          \       return movies_w_embeddings\n\n        def generate_embeddings_sentence_transformer(shows,\
          \ fields_to_use, model):\n            show_texts = []\n            for show\
          \ in shows:\n                combined_text = []\n                for field\
          \ in fields_to_use:\n                    if isinstance(show[field], list):\n\
          \                        combined_text.append(', '.join(show[field]))\n\
          \                    else:\n                        combined_text.append(show[field])\n\
          \                show_texts.append(' '.join(combined_text))\n          \
          \  embeddings = model.encode(show_texts, show_progress_bar=True)\n     \
          \       for i, show in enumerate(shows):\n                show['embedding']\
          \ = embeddings[i].tolist()\n            return shows\n\n        def save_embeddings_to_database(movie_embeddings,\
          \ series_embeddings):\n            try:\n                embeddings = []\n\
          \                has_embedding_edges = []\n                for movie_embedding\
          \ in movie_embeddings:\n                    embedding_key = generate_key()\n\
          \                    movie_key = movie_embedding['movieId']\n          \
          \          embeddings.append({\n                        '_key': embedding_key,\n\
          \                        'show_key': movie_key,\n                      \
          \  'show_type': 'movie',\n                        'show_name': movie_embedding['name'],\n\
          \                        **({'img_name': movie_embedding['poster']} if\n\
          \                        'poster' in movie_embedding and movie_embedding['poster']\
          \ != 'N/A' else {}),\n                        'embedding_vector': movie_embedding['embedding']\n\
          \                    })\n                    has_embedding_edges.append({\n\
          \                        '_key': embedding_key,\n                      \
          \  '_from': f\"movies/{movie_key}\",\n                        '_to': f\"\
          embeddings/{embedding_key}\"\n                    })\n                for\
          \ serie_embeddings in series_embeddings:\n                    embedding_key\
          \ = generate_key()\n                    serie_key = serie_embeddings['series_id']\n\
          \                    embeddings.append({\n                        '_key':\
          \ embedding_key,\n                        'show_key': serie_key,\n     \
          \                   'show_type': 'serie',\n                        'show_name':\
          \ serie_embeddings['name'],\n                        **({'img_name': serie_embeddings['poster']}\
          \ if\n                        'poster' in serie_embeddings and serie_embeddings['poster']\
          \ != 'N/A' else {}),\n                        'embedding_vector': serie_embeddings['embedding']\n\
          \                    })\n                    has_embedding_edges.append({\n\
          \                        '_key': embedding_key,\n                      \
          \  '_from': f\"series/{serie_key}\",\n                        '_to': f\"\
          embeddings/{embedding_key}\"\n                    })\n\n               \
          \ print('Saving', len(embeddings), 'embeddings')\n                save_many_to_database_in_batches('embeddings',\
          \ embeddings)\n                print('Saving', len(has_embedding_edges),\
          \ 'has embedding edges')\n                save_many_to_database_in_batches('has_embedding',\
          \ has_embedding_edges)\n            except Exception as e:\n           \
          \     print(e)\n\n        def generate_key() -> str:\n            try:\n\
          \                unique_id = uuid.uuid4()\n                numeric_key =\
          \ unique_id.int\n                return str(numeric_key)\n            except\
          \ Exception as e:\n                print(e)\n\n        def save_many_to_database_in_batches(collection_name,\
          \ data, batch_size=1000):\n            try:\n                client = ArangoClient(hosts=url,\
          \ request_timeout=2000, verify_override=False)\n                db = client.db(db_name,\
          \ username=username, password=password)\n                collection = db.collection(collection_name)\n\
          \                # Break the data into smaller batches and insert them\n\
          \                for i in range(0, len(data), batch_size):\n           \
          \         batch = data[i:i+batch_size]\n                    result = collection.insert_many(batch,\
          \ overwrite=True, overwrite_mode='update')\n                    print(f'Saved\
          \ batch of {len(batch)} items to {collection_name}')\n\n               \
          \ return result\n            except Exception as e:\n                print(f\"\
          Error saving {collection_name}: {e}\")\n                return []\n\n  \
          \      def save_movies_with_embedding_to_csv(movies_data, filename):\n \
          \           header = [\n                'movieId', 'title', 'genres', 'imdb_link',\
          \ 'name', 'directors', 'writers', 'actors', 'plot',\n                'languages',\
          \ 'country_of_origin', 'awards', 'poster', 'ratings', 'embedding'\n    \
          \        ]\n            with open(filename, 'w', newline='', encoding='utf-8')\
          \ as f:\n                writer = csv.DictWriter(f, fieldnames=header)\n\
          \                writer.writeheader()\n                for movie in movies_data:\n\
          \                    try:\n                        ordered_movie = {key:\
          \ movie.get(key, '') for key in header}\n                        writer.writerow(ordered_movie)\n\
          \                    except Exception as e:\n                        print(f\"\
          Error processing movie {movie['title']}: {e}\")\n\n        def save_series_with_embedding_to_csv(series_data,\
          \ filename):\n            header = [\n                'series_id', 'vote_average',\
          \ 'vote_count', 'name', 'year', 'release_date', 'genres', 'directors',\n\
          \                'writers', 'actors', 'plot', 'languages', 'country_of_origin',\
          \ 'awards', 'poster',\n                'ratings', 'imdb_link', 'total_seasons',\
          \ 'embedding'\n            ]\n            with open(filename, 'w', newline='',\
          \ encoding='utf-8') as f:\n                writer = csv.DictWriter(f, fieldnames=header)\n\
          \                writer.writeheader()\n                for serie in series_data:\n\
          \                    try:\n                        ordered_serie = {key:\
          \ serie.get(key, '') for key in header}\n                        writer.writerow(ordered_serie)\n\
          \                    except Exception as e:\n                        print(f\"\
          Error processing series {serie['name']}: {e}\")\n\n        DATA_BUCKET =\
          \ \"data\"\n\n        movie_embeddings = []\n        serie_embeddings =\
          \ []\n\n        clear_collection('embeddings')\n\n        print(\"Updating\
          \ all embeddings.\")\n\n        # download show files\n        shows_dir\
          \ = '/tmp/shows'\n        os.makedirs(shows_dir, exist_ok=True)\n      \
          \  prefixes = [\"embeddings/initial/\", \"embeddings/new/\"]\n        for\
          \ prefix in prefixes:\n            objects = s3_client.list_objects_v2(Bucket=DATA_BUCKET,\
          \ Prefix=prefix)\n            if \"Contents\" in objects:\n            \
          \    for obj in objects.get(\"Contents\", []):\n                    file_key\
          \ = obj[\"Key\"]\n                    local_file_path = os.path.join(shows_dir,\
          \ os.path.basename(file_key))\n                    s3_client.download_file(DATA_BUCKET,\
          \ file_key, local_file_path)\n                    print(f\"Downloaded: {file_key}\
          \ \u2192 {local_file_path}\")\n                    # processing the file\n\
          \                    if 'movie' in file_key:\n                        movies_w_embeddings\
          \ = read_movie_embeddings(file)\n                        current_movies_embedding\
          \ = generate_embeddings_sentence_transformer(movies_w_embeddings, fields_to_use,\
          \ model)\n                        movie_embeddings.append(current_movies_embedding)\n\
          \                        save_embeddings_to_database(current_movies_embedding,\
          \ [])\n                    else:\n                        # file contains\
          \ series\n                        series_w_embeddings = read_serie_embeddings(file)\n\
          \                        current_series_embedding = generate_embeddings_sentence_transformer(series_w_embeddings,\
          \ fields_to_use, model)\n                        serie_embeddings.append(current_series_embedding)\n\
          \                        save_embeddings_to_database([], current_series_embedding)\n\
          \n        save_movies_with_embedding_to_csv(movie_embeddings, new_movie_embeddings_output)\n\
          \        save_series_with_embedding_to_csv(serie_embeddings, new_serie_embeddings_output)\n\
          \n\n    os.makedirs(TEMP_DIR, exist_ok=True)\n    s3_client.download_file(MODEL_BUCKET,\
          \ f\"{model_name}.zip\", MODEL_ZIP_PATH)\n    print(f\"Downloaded {model_name}.zip\
          \ to {MODEL_ZIP_PATH}\")\n    with zipfile.ZipFile(MODEL_ZIP_PATH, \"r\"\
          ) as zip_ref:\n        zip_ref.extractall(TEMP_DIR)\n    print(f\"Extracted\
          \ {model_name}.zip to {TEMP_DIR}\")\n    model_path = os.path.join(TEMP_DIR,\
          \ model_name)\n\n    print(\"Files in directory:\", os.listdir(train_data_folder))\n\
          \    train_data = []\n    for filename in os.listdir(train_data_folder):\n\
          \        file_path = os.path.join(train_data_folder, filename)\n       \
          \ if filename.endswith(\".json\"):\n            with open(file_path, \"\
          r\", encoding=\"utf-8\") as file:\n                try:\n              \
          \      data = json.load(file)\n                    if isinstance(data, list):\n\
          \                        train_data.extend(data)\n                    else:\n\
          \                        print(f\"Skipping {filename}: not an array\")\n\
          \                except json.JSONDecodeError:\n                    print(f\"\
          Skipping {filename}: invalid JSON\")\n    print(f\"Processing {len(train_data)}\
          \ training data.\")\n\n    model = SentenceTransformer(model_path)\n   \
          \ print(f\"Loaded model from {model_path}\")\n    trained_model_path = \"\
          /tmp/model/trained/final\"\n    fine_tuned_model = fine_tune_model(model,\
          \ train_data, trained_model_path, 3)\n    print(f\"Training done.\")\n \
          \   update_embeddings(fine_tuned_model, fields_to_use)\n    zip_path = f\"\
          /tmp/{model_name}.zip\"\n    zip_folder(trained_model_path, zip_path, model_name)\n\
          \    s3_client.upload_file(f\"{zip_path}\", MODEL_BUCKET, f\"{model_name}.zip\"\
          )\n    print(f\"Uploaded model to {model_name}.zip\")\n\n"
        image: python:3.9
        resources:
          cpuLimit: 4.0
          memoryLimit: 6.442450944
          resourceCpuLimit: '4'
          resourceMemoryLimit: 6Gi
    exec-upload-and-cleanup:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - upload_and_cleanup
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.11.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'boto3==1.36.16'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_and_cleanup(train_data_file: dsl.InputPath(),\n      \
          \              minio_endpoint: str, minio_access_key: str, minio_secret_key:\
          \ str,\n                    new_movie_embeddings: dsl.InputPath(), \n  \
          \                  new_serie_embeddings: dsl.InputPath()):\n    import os\n\
          \    import boto3\n    import json\n    from datetime import datetime\n\n\
          \n    DATA_BUCKET = \"data\"\n    s3_client = boto3.client(\n        \"\
          s3\",\n        endpoint_url=minio_endpoint,\n        aws_access_key_id=minio_access_key,\n\
          \        aws_secret_access_key=minio_secret_key\n    )\n    current_date\
          \ = datetime.now().strftime(\"%Y%m%d\")\n    remote_train_file = f\"train/processed/training_{current_date}.csv\"\
          \n\n    if os.path.exists(train_data_file):\n        s3_client.upload_file(train_data_file,\
          \ DATA_BUCKET, remote_train_file)\n        print(f\"Uploaded {train_data_file}\
          \ to {remote_train_file}\")\n\n    prefixes_to_delete = [\"train/new/\"\
          , \"embeddings/initial/\", \"embeddings/new/\"]\n    for prefix in prefixes_to_delete:\n\
          \        objects = s3_client.list_objects_v2(Bucket=DATA_BUCKET, Prefix=prefix)\n\
          \        if \"Contents\" in objects:\n            for obj in objects[\"\
          Contents\"]:\n                s3_client.delete_object(Bucket=DATA_BUCKET,\
          \ Key=obj[\"Key\"])\n                print(f\"Deleted {obj['Key']} from\
          \ {DATA_BUCKET}\")\n\n    remote_movies_file = f\"embeddings/initial/movies_w_embeddings_{current_date}.csv\"\
          \n    if os.path.exists(new_movie_embeddings):\n        s3_client.upload_file(new_movie_embeddings,\
          \ DATA_BUCKET, remote_movies_file)\n        print(f\"Uploaded {new_movie_embeddings}\
          \ to {remote_movies_file}\")\n\n    remote_series_file = f\"embeddings/initial/series_w_embeddings_{current_date}.csv\"\
          \n    if os.path.exists(new_serie_embeddings):\n        s3_client.upload_file(new_serie_embeddings,\
          \ DATA_BUCKET, remote_series_file)\n        print(f\"Uploaded {new_serie_embeddings}\
          \ to {remote_series_file}\")\n\n"
