pipelineInfo:
  description: A pipeline for downloading, creating embeddings, and cleaning up new
    show data
  name: new-show-data-processing-pipeline
root:
  dag:
    tasks:
      create-embeddings:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-create-embeddings
        dependentTasks:
        - process-csv-files
        inputs:
          artifacts:
            movies_json:
              taskOutputArtifact:
                outputArtifactKey: movies_output
                producerTask: process-csv-files
            series_json:
              taskOutputArtifact:
                outputArtifactKey: series_output
                producerTask: process-csv-files
          parameters:
            fields_to_use:
              runtimeValue:
                constant:
                - name
                - plot
                - genres
                - directors
                - actors
            minio_access_key:
              runtimeValue:
                constant: minio
            minio_endpoint:
              runtimeValue:
                constant: http://minio-service.kubeflow:9000
            minio_secret_key:
              runtimeValue:
                constant: minio123
            model_name:
              runtimeValue:
                constant: watchwise-20-ep
        taskInfo:
          name: create-embeddings
      download-csv-files:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-csv-files
        inputs:
          parameters:
            minio_access_key:
              runtimeValue:
                constant: minio
            minio_endpoint:
              runtimeValue:
                constant: http://minio-service.kubeflow:9000
            minio_secret_key:
              runtimeValue:
                constant: minio123
        taskInfo:
          name: download-csv-files
      process-csv-files:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-process-csv-files
        dependentTasks:
        - download-csv-files
        inputs:
          artifacts:
            input_dir:
              taskOutputArtifact:
                outputArtifactKey: output_dir
                producerTask: download-csv-files
        taskInfo:
          name: process-csv-files
      upload-and-cleanup:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-upload-and-cleanup
        dependentTasks:
        - create-embeddings
        inputs:
          artifacts:
            movies_csv:
              taskOutputArtifact:
                outputArtifactKey: movies_output
                producerTask: create-embeddings
            series_csv:
              taskOutputArtifact:
                outputArtifactKey: series_output
                producerTask: create-embeddings
          parameters:
            db_name:
              runtimeValue:
                constant: watchwiseRecommend
            minio_access_key:
              runtimeValue:
                constant: minio
            minio_endpoint:
              runtimeValue:
                constant: http://minio-service.kubeflow:9000
            minio_secret_key:
              runtimeValue:
                constant: minio123
            password:
              runtimeValue:
                constant: ''
            url:
              runtimeValue:
                constant: https://arangodb.default.svc.cluster.local:8529
            username:
              runtimeValue:
                constant: root
        taskInfo:
          name: upload-and-cleanup
schemaVersion: 2.1.0
sdkVersion: kfp-2.11.0
