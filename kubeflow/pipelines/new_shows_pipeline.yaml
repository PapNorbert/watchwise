          \ = f\"embeddings/new/series_w_embeddings_{current_date}.csv\"\n    genre_cache\
          \ = {}\n\n\n    def read_movies_with_embeddings(file_path):\n        with\
          \ open(file_path, mode='r', encoding='utf-8') as file:\n            csv_reader\
          \ = csv.reader(file)\n            header = next(csv_reader)\n          \
          \  movies = []\n            for row in csv_reader:\n                # arrays\n\
          \                row_genres = ast.literal_eval(row[2]) if row[2] else []\n\
          \                row_directors = ast.literal_eval(row[5]) if row[5] else\
          \ []\n                row_writers = ast.literal_eval(row[6]) if row[6] else\
          \ []\n                row_actors = ast.literal_eval(row[7]) if row[7] else\
          \ []\n                row_languages = ast.literal_eval(row[9]) if row[9]\
          \ else []\n                row_ratings = ast.literal_eval(row[13]) if row[13]\
          \ else []\n                embedding = ast.literal_eval(row[14]) if row[14]\
          \ else []\n\n                movies.append({\n                    'movieId':\
          \ row[0],\n                    'title': row[1],\n                    'genres':\
          \ row_genres,\n                    'imdb_link': row[3],\n              \
          \      'name': row[4],\n                    'directors': row_directors,\n\
          \                    'writers': row_writers,\n                    'actors':\
          \ row_actors,\n                    'plot': row[8],\n                   \
          \ 'languages': row_languages,\n                    'country_of_origin':\
          \ row[10],\n                    'awards': row[11],\n                   \
          \ 'poster': row[12],\n                    'ratings': row_ratings,\n    \
          \                'embedding': embedding\n                })\n          \
          \  return movies\n\n    def read_series_with_embeddings(file_path):\n  \
          \      with open(file_path, mode='r', encoding='utf-8') as file:\n     \
          \       csv_reader = csv.reader(file)\n            header = next(csv_reader)\n\
          \            series = []\n            for row in csv_reader:\n         \
          \       # arrays\n                vote_average = float(row[1]) if row[1]\
          \ else 0.0\n                vote_count = int(row[2]) if row[2] else 0\n\
          \                row_genres = ast.literal_eval(row[6]) if row[6] else []\n\
          \                directors_row = ast.literal_eval(row[7]) if row[7] else\
          \ []\n                writers_row = ast.literal_eval(row[8]) if row[8] else\
          \ []\n                actors_row = ast.literal_eval(row[9]) if row[9] else\
          \ []\n                row_languages = ast.literal_eval(row[11]) if row[11]\
          \ else []\n                ratings_row = ast.literal_eval(row[15]) if row[15]\
          \ else []\n                embedding_row = ast.literal_eval(row[18]) if\
          \ row[18] else []\n\n                series.append({\n                 \
          \   'series_id': row[0],\n                    'vote_average': vote_average,\n\
          \                    'vote_count': vote_count,\n                    'name':\
          \ row[3],\n                    'year': row[4],\n                    'release_date':\
          \ row[5],\n                    'genres': row_genres,\n                 \
          \   'directors': directors_row,\n                    'writers': writers_row,\n\
          \                    'actors': actors_row,\n                    'plot':\
          \ row[10],\n                    'languages': row_languages,\n          \
          \          'country_of_origin': row[12],\n                    'awards':\
          \ row[13],\n                    'poster': row[14],\n                   \
          \ 'ratings': ratings_row,\n                    'imdb_link': row[16],\n \
          \                   'total_seasons': row[17],\n                    'embedding':\
          \ embedding_row\n                })\n            return series\n\n    def\
          \ set_series_values(current_serie, serie):\n        if serie['name'] and\
          \ serie['name'] != 'N/A':\n            current_serie.update({'name': serie['name']})\n\
          \        if (serie['directors'] and serie['directors'] != 'N/A' and serie['directors']\
          \ != ['N/A']\n                and serie['directors'] != []):\n         \
          \   current_serie.update({'directors': serie['directors']})\n        if\
