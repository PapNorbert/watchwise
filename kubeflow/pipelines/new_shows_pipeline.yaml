          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.11.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'boto3==1.36.16'\
          \ 'python-arango==8.1.0' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef upload_and_cleanup(movies_csv: dsl.InputPath(), series_csv: dsl.InputPath(),\n\
          \                    url: str, db_name: str, username: str, password: str,\n\
          \                    minio_endpoint: str, minio_access_key: str, minio_secret_key:\
          \ str):\n    import os\n    import boto3\n    import uuid\n    import csv\n\
          \    import ast\n    import re\n    from datetime import datetime\n    from\
          \ arango import ArangoClient\n\n\n    DATA_BUCKET = \"data\"\n    s3_client\
          \ = boto3.client(\n        \"s3\",\n        endpoint_url=minio_endpoint,\n\
          \        aws_access_key_id=minio_access_key,\n        aws_secret_access_key=minio_secret_key\n\
          \    )\n    current_date = datetime.now().strftime(\"%Y%m%d\")\n    remote_movie_file\
